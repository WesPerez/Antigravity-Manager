name: MINE Container

on:
  push:
    branches:
      - MINE
  workflow_dispatch:

env:
  IMAGE_NAME: ghcr.io/wesperez/antigravity-manager

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out MINE
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/amd64
          push: true
          build-args: |
            USE_MIRROR=false
          tags: |
            ${{ env.IMAGE_NAME }}:mine
            ${{ env.IMAGE_NAME }}:mine-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.ref.name=MINE
          cache-from: type=gha,scope=antigravity-manager-mine
          cache-to: type=gha,mode=max,scope=antigravity-manager-mine
