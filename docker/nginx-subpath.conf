# Include inside the HTTPS server block. Keep the trailing slashes on the
# location, proxy_pass and base href; they preserve deep-link asset resolution.
location = /antimanager { return 301 /antimanager/; }
location ^~ /antimanager/ {
    proxy_pass http://127.0.0.1:8045/;
    proxy_http_version 1.1;
    proxy_buffering off;
    proxy_request_buffering off;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Prefix /antimanager;
    proxy_cookie_path / /antimanager/;
    client_max_body_size 100m;

    # sub_filter defaults to text/html. JavaScript and API bodies are unchanged.
    proxy_set_header Accept-Encoding "";
    sub_filter_once on;
    sub_filter '<head>' '<head><base href="/antimanager/">';
}
